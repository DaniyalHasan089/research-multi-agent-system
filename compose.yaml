services:

  # ── FastAPI Application ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-api
    restart: unless-stopped

    # Load all secrets / config from .env — nothing is hard-coded here.
    env_file:
      - .env

    # Expose internally only; Nginx is the single public entry point.
    expose:
      - "8000"

    # Persist generated PDFs across container restarts.
    # xhtml2pdf writes to /tmp/research_agent_pdfs inside the container.
    volumes:
      - pdf_storage:/tmp/research_agent_pdfs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - app_network

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: research-agent-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  pdf_storage:


# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge

