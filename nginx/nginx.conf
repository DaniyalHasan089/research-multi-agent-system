# ── Nginx Reverse Proxy Configuration ─────────────────────────────────────────
# Proxies all traffic to the FastAPI container.
# SSE streaming (/research) is handled without buffering.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Basic performance ──────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 75s;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript;

    # ── Upstream: FastAPI app ──────────────────────────────────────────────────
    # "api" resolves via Docker's internal DNS to the api container.
    upstream fastapi {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;          # Accept any hostname / IP

        # ── SSE Streaming: /research ─────────────────────────────────────────
        # This endpoint returns a long-lived SSE stream.
        # All buffering MUST be disabled or the client never receives events.
        location /research {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;

            # Required headers
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Disable all buffering so SSE events reach the browser immediately
            proxy_buffering            off;
            proxy_cache                off;
            proxy_read_timeout         600s;   # Research can take several minutes
            proxy_send_timeout         600s;
            proxy_connect_timeout      10s;

            # Tell the browser (and any CDN) not to cache SSE responses
            add_header Cache-Control   "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ── PDF Downloads: /download ──────────────────────────────────────────
        location /download/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Allow large PDF responses
            proxy_buffering    on;
            proxy_read_timeout 120s;
        }

        # ── All other routes (/, /docs, /openapi.json …) ─────────────────────
        location / {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }
}

